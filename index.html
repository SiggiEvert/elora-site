<style>
:root{
  --paper:#E6E9E7;
  --ink:#12171A;
  --ink-2:#5A666C;
  --rule:#C7CECB;
  --rev:#A81B52;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* the amendment change bar */
body::before{
  content:"";
  position:fixed;
  left:0;top:0;bottom:0;
  width:6px;
  background:var(--rev);
}

.wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(28px,7vw,80px);
  padding-left:clamp(34px,7vw,86px);
  max-width:1000px;
}

/* wordmark */
.mark{
  font-weight:700;
  letter-spacing:.34em;
  font-size:clamp(1.05rem,2.4vw,1.5rem);
  line-height:1;
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:clamp(30px,6vw,52px);
}
.mark::before{
  content:"";
  width:3px;
  height:1.15em;
  background:var(--rev);
  flex:none;
}

/* catchphrase */
h1{
  font-weight:700;
  font-size:clamp(2rem,6.4vw,4.4rem);
  line-height:1.06;
  letter-spacing:-.033em;
  margin:0;
  max-width:17ch;
}

.sub{
  margin:clamp(24px,4vw,34px) 0 0;
  font-size:clamp(1rem,2vw,1.25rem);
  font-weight:400;
  line-height:1.5;
  color:var(--ink-2);
  max-width:44ch;
}

footer{
  border-top:1px solid var(--rule);
  padding:22px clamp(28px,7vw,80px);
  padding-left:clamp(34px,7vw,86px);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-2);
  display:flex;
  flex-wrap:wrap;
  gap:10px 26px;
  justify-content:space-between;
}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
footer a:hover{color:var(--rev);border-color:var(--rev)}
a:focus-visible{outline:2px solid var(--rev);outline-offset:3px}

/* entrance */
.fade{opacity:0;animation:in .7s ease forwards}
.fade:nth-child(1){animation-delay:.05s}
.fade:nth-child(2){animation-delay:.18s}
.fade:nth-child(3){animation-delay:.31s}
@keyframes in{to{opacity:1;transform:none}}
.fade{transform:translateY(8px)}
@media(prefers-reduced-motion:reduce){
  .fade{opacity:1;transform:none;animation:none}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="mark fade">ELORA</div>
  <h1 class="fade">What configuration is this aircraft in — and can you prove it?</h1>
  <p class="sub fade">We are building the configuration and compliance layer for airline engineering. Every answer returns a source you can open.</p>
</div>

</footer>
